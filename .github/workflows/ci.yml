name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned: macos-latest can flip silently when GitHub rotates the
    # default. Bump deliberately when retesting on a newer macOS.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI only reads the tree (build, vet, test, scan); it never
          # pushes back. Don't leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Verify every module has a matching checksum in go.sum. Catches
      # tampering with the module cache or go.sum.
      - run: go mod verify

      - run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.0
          "$(go env GOPATH)/bin/staticcheck" ./...

      - run: make test

      # Scan for known-vulnerable transitive dependencies. Pinned to a
      # specific version to keep the supply chain deterministic.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
